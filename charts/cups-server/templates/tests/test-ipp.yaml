apiVersion: v1
kind: Pod
metadata:
  name: {{ include "cups-server.fullname" . }}-test-ipp
  labels: {{- include "cups-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: ipp
      image: {{ include "cups-server.image" . }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
      env:
        - name: CUPS_SERVER
          value: "{{ include "cups-server.fullname" . }}:{{ .Values.service.port }}"
      command: ["/bin/bash", "-euo", "pipefail", "-c"]
      args:
        - |
          lpstat -r
          lpstat -v || true
          {{- if .Values.metrics.enabled }}
          exec 3<>/dev/tcp/{{ include "cups-server.fullname" . }}/{{ .Values.metrics.port }}
          printf "GET /metrics HTTP/1.0\r\n\r\n" >&3
          cat <&3 | grep -q "^cups_up " && echo "metrics OK"
          {{- end }}
