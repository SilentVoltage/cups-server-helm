{{- $edns := fromYaml (include "cups-server.externalDNSAnnotations" (dict "ctx" . "kind" "service")) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cups-server.fullname" . }}
  labels:
    {{- include "cups-server.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}{{- toYaml . | nindent 4 }}{{- end }}
  {{- with merge (dict) .Values.service.annotations $edns }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  ports:
    - name: ipp
      port: {{ .Values.service.port }}
      targetPort: ipp
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector: {{- include "cups-server.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cups-server.fullname" . }}-headless
  labels: {{- include "cups-server.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - {name: ipp, port: 631, targetPort: ipp, protocol: TCP}
  selector: {{- include "cups-server.selectorLabels" . | nindent 4 }}
{{- if .Values.service.extra.enabled }}
---
# Raw IPP endpoint for clients that cannot traverse the Ingress
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cups-server.fullname" . }}-ipp
  labels: {{- include "cups-server.labels" . | nindent 4 }}
  {{- with merge (dict) .Values.service.extra.annotations $edns }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.extra.type }}
  ports:
    - {name: ipp, port: 631, targetPort: ipp, protocol: TCP}
  selector: {{- include "cups-server.selectorLabels" . | nindent 4 }}
{{- end }}
