{{- $fullName := include "cups-server.fullname" . -}}
{{- $authSecret := printf "%s-auth" $fullName -}}
{{- $userKey := .Values.auth.existingSecretUserKey -}}
{{- $pwKey := .Values.auth.existingSecretPasswordKey -}}
{{- $existing := dict -}}
{{- if and (include "cups-server.authEnabled" .) (not .Values.auth.existingSecret) -}}
{{- $existing = (lookup "v1" "Secret" .Release.Namespace $authSecret) | default dict -}}
{{- end -}}
{{- $existingData := (get $existing "data") | default dict -}}
{{- $stored := (get $existingData $pwKey) | default "" -}}
{{- $password := "" -}}
{{- if .Values.auth.password -}}
{{- $password = .Values.auth.password -}}
{{- else if $stored -}}
{{- $password = b64dec $stored -}}
{{- else -}}
{{- $password = randAlphaNum 24 -}}
{{- end -}}
{{- if and (include "cups-server.authEnabled" .) (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $authSecret }}
  labels: {{- include "cups-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $userKey }}: {{ .Values.auth.username | quote }}
  {{ $pwKey }}: {{ $password | quote }}
{{- end }}
{{- if and (include "cups-server.ingressAuth" .) .Values.ingress.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-basic-auth
  labels: {{- include "cups-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Traefik's basicAuth loader errors if the Secret contains more than one
  # candidate key ("found N elements ... must be single element exactly"), so
  # this can no longer emit both `auth` and `users` unconditionally - only the
  # key the configured controller actually reads.
  {{- if eq .Values.auth.ingressController "traefik" }}
  users: {{ htpasswd .Values.auth.username $password | quote }}
  {{- else }}
  auth: {{ htpasswd .Values.auth.username $password | quote }}
  {{- end }}
{{- end }}
